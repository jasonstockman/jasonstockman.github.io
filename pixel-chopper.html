<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
    <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
    <title>Pixel Chopper - Jason Stockman</title>
    <style>
        :root {
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --text-light: #9ca3af;
            --border-color: #e5e7eb;
            --card-bg: #f9fafb;
            --accent: #2563eb;
            --toggle-bg: rgba(0,0,0,0.06);
            --toggle-hover: rgba(0,0,0,0.1);
        }
        html[data-theme="dark"] {
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --text-light: #64748b;
            --border-color: #1e293b;
            --card-bg: #1e293b;
            --accent: #93bbfd;
            --toggle-bg: rgba(255,255,255,0.08);
            --toggle-hover: rgba(255,255,255,0.14);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #fafafa 0%, #f5f5f4 35%, #f0f0ee 65%, #fafaf8 100%);
            color: var(--text-color);
            line-height: 1.5;
            min-height: 100vh;
        }
        html[data-theme="dark"] body {
            background: linear-gradient(135deg, #0f172a 0%, #111827 35%, #0f1520 65%, #101a2e 100%);
        }
        a { color: inherit; text-decoration: none; }
        a:hover { opacity: 0.8; }
        img { display: block; max-width: 100%; height: auto; }
        .page {
            max-width: 72rem;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
            position: relative;
        }
        .topbar {
            display: flex;
            align-items: center;
            min-height: 2.25rem;
        }
        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            transition: color 0.2s, opacity 0.2s;
        }
        .home-link:hover {
            color: var(--accent);
            opacity: 1;
        }
        .home-link svg {
            width: 1rem;
            height: 1rem;
        }
        .theme-toggle {
            position: absolute;
            top: 2rem;
            right: 1.5rem;
            width: 2.25rem;
            height: 2.25rem;
            border: none;
            border-radius: 0.5rem;
            background: var(--toggle-bg);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }
        .theme-toggle:hover { background: var(--toggle-hover); }
        .theme-toggle:focus-visible,
        .home-link:focus-visible,
        .footer-icon-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .theme-toggle svg { width: 1.125rem; height: 1.125rem; }
        .theme-toggle .icon-sun { display: none; }
        html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
        html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        .gallery-header {
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin: 1.5rem 0;
            padding: 1.5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 1rem;
        }
        h1 {
            color: var(--text-color);
            font-size: 2rem;
            line-height: 1.15;
            font-weight: 650;
        }
        .count {
            color: var(--text-light);
            font-size: 0.875rem;
            white-space: nowrap;
        }
        .gallery-grid {
            column-count: 2;
            column-gap: 0.75rem;
        }
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 0.75rem;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            background: var(--card-bg);
        }
        .gallery-item img {
            width: 100%;
            transition: transform 0.28s ease, filter 0.28s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.025);
            filter: saturate(1.06);
        }
        footer {
            width: 100%;
            max-width: 72rem;
            margin: 0 auto;
            padding: 0 1.5rem 1.5rem;
        }
        .footer-inner {
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            color: var(--text-light);
            font-size: 0.875rem;
        }
        .footer-icon-link {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 0.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            transition: color 0.2s, background 0.2s, opacity 0.2s;
        }
        .footer-icon-link:hover {
            color: var(--accent);
            background: var(--toggle-bg);
            opacity: 1;
        }
        .footer-icon-link svg {
            width: 1.35rem;
            height: 1.35rem;
        }
        @media (min-width: 640px) {
            .gallery-grid { column-count: 3; }
            h1 { font-size: 2.5rem; }
        }
        @media (min-width: 960px) {
            .gallery-grid {
                column-count: 4;
                column-gap: 1rem;
            }
            .gallery-item { margin-bottom: 1rem; }
        }
        @media (min-width: 1200px) {
            .gallery-grid { column-count: 5; }
        }
        @media (max-width: 520px) {
            .page { padding-top: 1.5rem; }
            .theme-toggle { top: 1.5rem; }
            .gallery-header {
                align-items: flex-start;
                flex-direction: column;
            }
            .footer-inner {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <main class="page">
        <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="icon-moon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
            </svg>
            <svg class="icon-sun" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5"/><path stroke-linecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.73 12.73l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
        </button>

        <nav class="topbar" aria-label="Primary">
            <a class="home-link" href="index.html">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/>
                </svg>
                Jason Stockman
            </a>
        </nav>

        <header class="gallery-header">
            <h1>Pixel Chopper</h1>
            <p class="count"><span id="image-count">0</span> images</p>
        </header>

        <section class="gallery-grid" aria-label="Image gallery" id="gallery"></section>
    </main>

    <footer>
        <div class="footer-inner">
            <p>Designed with &#x1FAF0; in Pacifica, CA</p>
            <a class="footer-icon-link" href="index.html" aria-label="Home">
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5 12 3l9 7.5"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 9.5V21h5v-6h4v6h5V9.5"/>
                </svg>
            </a>
            <p>&copy; Copyright <span id="year">2026</span></p>
        </div>
    </footer>

    <script>
        const now = new Date();
        document.getElementById('year').textContent = now.getFullYear();

        const sizes = [
            [480, 640], [640, 480], [520, 780], [620, 620],
            [480, 720], [720, 520], [540, 700], [680, 920]
        ];
        const totalImages = 64;
        const gallery = document.getElementById('gallery');
        const imageCount = document.getElementById('image-count');

        for (let index = 1; index <= totalImages; index += 1) {
            const size = sizes[(index - 1) % sizes.length];
            const figure = document.createElement('figure');
            const image = document.createElement('img');
            const padded = String(index).padStart(2, '0');

            figure.className = 'gallery-item';
            image.src = `https://picsum.photos/seed/pixel-chopper-${padded}/${size[0]}/${size[1]}`;
            image.width = size[0];
            image.height = size[1];
            image.alt = `Gallery image ${index}`;
            image.decoding = 'async';
            image.loading = index <= 10 ? 'eager' : 'lazy';

            figure.appendChild(image);
            gallery.appendChild(figure);
        }

        imageCount.textContent = totalImages;

        document.querySelector('.theme-toggle').addEventListener('click', function() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>
</body>
</html>
